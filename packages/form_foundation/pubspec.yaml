name: form_foundation
description: >-
  Schema-agnostic building blocks for form UIs: themable field widgets,
  editor groups, labels, and error panels shared by form generators.
version: 0.2.0
# The repository URL points at the package's directory inside the monorepo
# (the /tree/ form pub.dev understands), so relative links in the README
# resolve against the right subtree.
homepage: https://github.com/astoniocom/json_schema_form_builder
repository: https://github.com/astoniocom/json_schema_form_builder/tree/main/packages/form_foundation
resolution: workspace

# Shown in the pub.dev gallery; the same image illustrates the README.
screenshots:
  - description: A hand-written contact form composed from the package's widgets.
    path: screenshots/contact_form.webp

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  material_ui: ^1.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
