<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Interactive demo of json_schema_form_builder: Flutter forms generated live from JSON Schema. Edit a schema and watch the form rebuild.">

  <!-- Link previews in chats and social media. og:image/og:url should be
       absolute; set the final host when the demo gets its public URL. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JSON Schema Form Builder">
  <meta property="og:title" content="JSON Schema Form Builder Demo">
  <meta property="og:description" content="Flutter forms generated live from JSON Schema. Pick a sample, edit the schema and watch the form rebuild.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="demo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JSON Schema Form Builder Demo</title>
  <link rel="manifest" href="manifest.json">

  <!-- Shown while the engine and fonts download; removed on the first
       rendered Flutter frame. -->
  <style>
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #F5F5F7;
      color: #6E6E73;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 122, 255, 0.25);
      border-top-color: #007AFF;
      border-radius: 50%;
      animation: loading-spin 1s linear infinite;
    }
    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      #loading { background: #1E1E20; color: #98989D; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading JSON Schema Form Builder demo…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
