name: demo
description: "Full-featured demo of json_schema_form_builder, compiled for online testing."
publish_to: "none"
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  control_style: ^0.1.1
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  json_schema_builder: ^0.1.7
  json_schema_form_builder: ^0.1.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
